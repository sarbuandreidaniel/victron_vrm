<!doctype html>
<!--
  victron-vrm-card outside Home Assistant, for checking layout and behaviour in a browser.

  Serve the repository root and open this page:
      python3 -m http.server 8765 -d integrations/victron_vrm
      http://localhost:8765/scripts/harness/?view=amortizare      (zi | saptamana | luna | an | masina | baterie | amortizare | setari)
  Optional: &d=2026-07-14 (shown date), &admin=0 (non-admin user), &evfrom=2025-11-01 (first EV day), &ev=charging (charger status for the
  Mașina view: disconnected | connected | charging | charged | waiting_for_sun | overheating_detected | unavailable),
  &bat=chg | dis | idle (battery state for the Baterie view), &socfrom=2026-10-01 (first day of SoC statistics).

  The data is generated below by a small deterministic model (7 kW solar, 20 kWh battery, EV charger
  from 2026-10-12 on); it is not real installation data. The fake `hass.callWS` answers the same
  commands, in the same shapes, as websocket.py. In the console: `el` is the card, `hassFake` the fake
  hass (`hassFake.fin` = saved finance options, `hassFake.calls` = every write).
-->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>victron-vrm-card harness</title>
<body style="background:#111;margin:0;padding:8px">
<div id="c"></div>
<script src="../../custom_components/victron_vrm/frontend/victron-vrm-card.js"></script>
<script>
(() => {
  const CODES = ['Pc', 'Pb', 'Pg', 'Bc', 'Bg', 'Gc', 'Gb', 'Pe', 'Be', 'Ge'];
  const q = new URLSearchParams(location.search);
  const evFrom = /^\d{4}-\d{2}-\d{2}$/.test(q.get('evfrom') || '') ? q.get('evfrom').split('-').map(Number) : [2026, 10, 12];
  const START = new Date(2025, 9, 22), EV_FROM = new Date(evFrom[0], evFrom[1] - 1, evFrom[2]);
  const p2 = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  // pseudo-aleator determinist, ca fiecare încărcare să arate aceleași cifre
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const SUN = [0.3, 0.42, 0.62, 0.8, 0.92, 1, 1, 0.94, 0.78, 0.55, 0.34, 0.26];   // vârf relativ pe luni
  const CAP = 20, RESERVE = 4, PEAK = 7;

  // o zi = 24 de ore × CODES, cu starea bateriei purtată de la o zi la alta
  const hours = {}, socDay = {}, now = new Date();
  let soc = 10;
  for (let d = new Date(START); d <= now; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
    const r = rng(+d / 864e5), doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    const len = 12 + 3.6 * Math.sin(2 * Math.PI * (doy - 80) / 365), rise = 13 - len / 2;
    const sky = r() < 0.55 ? 0.85 + 0.15 * r() : 0.15 + 0.5 * r();
    const ev = d >= EV_FROM && r() < 0.4;
    const day = {}, sd = [];
    for (let h = 0; h < 24; h++) {
      const x = (h + 0.5 - rise) / len;
      const pv = x > 0 && x < 1 ? PEAK * SUN[d.getMonth()] * sky * Math.sin(Math.PI * x) ** 1.5 * (0.9 + 0.2 * r()) : 0;
      const house = 0.35 + (h >= 7 && h < 9 ? 0.6 : 0) + (h >= 18 && h < 23 ? 1.0 : 0) + 0.3 * r();
      const car = ev && h >= 19 && h < 22 ? 2.3 : 0, load = house + car, share = car / load;
      const v = Object.fromEntries(CODES.map((c) => [c, 0]));
      v.Pc = Math.min(pv, load);
      const surplus = pv - v.Pc;
      v.Pb = Math.min(surplus, Math.max(0, CAP - soc) / 0.92); v.Pg = surplus - v.Pb;
      const deficit = load - v.Pc;
      v.Bc = Math.min(deficit, Math.max(0, soc - RESERVE) * 0.95); v.Gc = deficit - v.Bc;
      if (h < 5 && soc < RESERVE + 1 && sky < 0.5) v.Gb = 1.5;   // încărcare din rețea în nopțile cu bateria jos
      soc = Math.min(CAP, soc + (v.Pb + v.Gb) * 0.92 - v.Bc / 0.95 - 0.03);
      sd.push(Math.max(0, soc) / CAP * 100);
      v.Pe = v.Pc * share; v.Be = v.Bc * share; v.Ge = v.Gc * share;
      if (CODES.some((c) => v[c] > 0)) day[p2(h)] = CODES.map((c) => Math.round(v[c] * 1000) / 1000);
    }
    hours[iso(d)] = day;
    socDay[iso(d)] = { start: +d, end: +d + 864e5, min: Math.min(...sd), max: Math.max(...sd), mean: sd.reduce((a, x) => a + x, 0) / sd.length };
  }
  const add = (a, b) => a.map((x, i) => x + b[i]);
  const zero = () => CODES.map(() => 0);
  const dayT = Object.fromEntries(Object.entries(hours).map(([k, h]) => [k, Object.values(h).reduce(add, zero())]));
  const years = {};
  for (const [k, t] of Object.entries(dayT)) {
    const [y, m] = k.split('-'), Y = (years[y] = years[y] || { t: zero(), m: {}, n: {} });
    Y.t = add(Y.t, t); Y.m[m] = add(Y.m[m] || zero(), t); Y.n[m] = (Y.n[m] || 0) + 1;
  }

  const view = q.get('view') || 'zi';
  const evs = q.get('ev') || 'charging', live = evs === 'charging';
  const bat = q.get('bat') || 'dis', bp = bat === 'chg' ? 3120 : bat === 'dis' ? -685 : 4;
  const socFrom = /^\d{4}-\d{2}-\d{2}$/.test(q.get('socfrom') || '') ? q.get('socfrom') : '2026-10-01';
  const S = (state, attributes = {}) => ({ state: String(state), attributes });
  // stația și mașina, cu aceleași entități ca integrarea victron_gx (prefix evcs_demo / ev_demo)
  const states = {
    'automation.energie_vrm': S('on', { friendly_name: 'Energie VRM: rezumat zilnic, lunar și anual', last_triggered: new Date(Date.now() - 3600e3).toISOString() }),
    'sensor.evcs_demo_status': S(evs, { friendly_name: 'EVCS Status' }),
    'sensor.evcs_demo_power': S(live ? 7180 : 0, { unit_of_measurement: 'W' }),
    'sensor.evcs_demo_current': S(live ? 10.4 : 0, { unit_of_measurement: 'A' }),
    'select.evcs_demo_mode': S('manual', { options: ['manual', 'auto', 'scheduled_charge'] }),
    'switch.evcs_demo_ev_charging': S(live ? 'on' : 'off'),
    'number.evcs_demo_charge_current_setpoint': S(16, { min: 6, max: 32, step: 1, unit_of_measurement: 'A' }),
    'switch.evcs_demo_auto_start': S('on'),
    'sensor.evcs_demo_total_energy': S(199.36, { unit_of_measurement: 'kWh' }),
    'sensor.evcs_demo_last_session_energy': S(14.2, { unit_of_measurement: 'kWh' }),
    'sensor.evcs_demo_last_session_time': S(135, { unit_of_measurement: 'min' }),
    'sensor.ev_demo_state_of_charge': S(64, { friendly_name: 'Mașina demo State of charge', unit_of_measurement: '%' }),
    'sensor.ev_demo_target_state_of_charge': S(90, { unit_of_measurement: '%' }),
    'sensor.ev_demo_charging_state': S(live ? 'charging' : 'not_charging'),
    // bateria, cu entitățile implicite ale cardului (dispozitivul GX din victron_gx) plus câteva date în `battery:`
    'sensor.gx_device_dc_battery_charge': S(68, { unit_of_measurement: '%' }),
    'sensor.gx_device_active_soc_limit': S(50, { unit_of_measurement: '%' }),
    'select.gx_device_ess_mode': S('optimized_no_battery_life', { options: ['optimized_battery_life', 'optimized_no_battery_life', 'keep_batteries_charged', 'external_control'] }),
    'number.gx_device_ess_min_soc_limit': S(50, { min: 0, max: 100, step: 5, unit_of_measurement: '%' }),
    'switch.ess_force_charge': S('off'),
    'number.gx_device_ess_max_charge_current': S(100, { min: -1, max: 10000, step: 1, unit_of_measurement: 'A' }),
    'number.gx_device_ess_max_charge_power_limit': S(-1, { min: -1, max: 1000000, step: 50, unit_of_measurement: 'W' }),
    'number.gx_device_ess_max_inverter_power_limit': S(-1, { min: -1, max: 1000000, step: 50, unit_of_measurement: 'W' }),
    'number.gx_device_ess_max_feed_in_power': S(7055, { min: -1, max: 1000000, step: 1, unit_of_measurement: 'W' }),
    'sensor.demo_battery_power': S(bp, { unit_of_measurement: 'W' }),
    'sensor.demo_battery_voltage': S(52.31, { unit_of_measurement: 'V' }),
    'sensor.demo_battery_current': S(bp / 52.3, { unit_of_measurement: 'A' }),
    'sensor.demo_battery_temperature': S(13.5, { unit_of_measurement: '°C' }),
    'sensor.demo_time_left': S(bat === 'dis' ? '5h 47min' : 'Nu se descarca'),
    'sensor.demo_time_to_full': S(bat === 'chg' ? '2h 05min' : 'Nu se incarca'),
  };
  const hass = {
    states, calls: [], user: { is_admin: q.get('admin') !== '0' },
    fin: { investment: 80000, price_import: 1.11, price_export: 0.45 },
    // aceleași răspunsuri ca websocket.py
    callWS: async (m) => {
      if (m.type === 'victron_vrm/info') return { codes: CODES, site: 'Instalație demo', start: iso(START), synced: new Date().toISOString(), backfilling: false, finance: hass.fin };
      if (m.type === 'victron_vrm/years') return { codes: CODES, years };
      if (m.type === 'victron_vrm/days') return { codes: CODES, days: Object.fromEntries(Object.entries(dayT).filter(([k]) => k >= m.start && k <= m.end)) };
      if (m.type === 'victron_vrm/hours') return { codes: CODES, hours: hours[m.date] || {} };
      if (m.type === 'victron_vrm/ev') {
        const idx = ['Pe', 'Be', 'Ge'].map((c) => CODES.indexOf(c)), out = {};
        for (const [k, day] of Object.entries(hours)) {
          if (k < m.start || k > m.end) continue;
          const hs = Object.fromEntries(Object.entries(day).map(([hh, v]) => [hh, idx.map((i) => v[i])]).filter(([, v]) => v.some((x) => x > 0)));
          if (Object.keys(hs).length) out[k] = hs;
        }
        return { codes: ['Pe', 'Be', 'Ge'], hours: out };
      }
      if (m.type === 'victron_vrm/flows') {
        const idx = m.codes.map((c) => CODES.indexOf(c)), out = {};
        for (const [k, day] of Object.entries(hours)) {
          if (k < m.start || k > m.end) continue;
          const hs = Object.fromEntries(Object.entries(day).map(([hh, v]) => [hh, idx.map((i) => v[i])]).filter(([, v]) => v.some((x) => x > 0)));
          if (Object.keys(hs).length) out[k] = hs;
        }
        return { codes: m.codes, hours: out };
      }
      // statisticile HA pentru SoC: minim / maxim / medie pe zi, de la socFrom
      if (m.type === 'recorder/statistics_during_period') {
        const a = iso(new Date(m.start_time)), b = iso(new Date(+new Date(m.end_time) - 1));
        return { [m.statistic_ids[0]]: Object.entries(socDay).filter(([k]) => k >= a && k <= b && k >= socFrom).map(([, p]) => p) };
      }
      if (m.type === 'victron_vrm/finance') {
        hass.calls.push(m);
        const f = {};
        for (const k of ['investment', 'price_import', 'price_export']) if (m[k] != null) f[k] = m[k];
        if (m.prices) {
          const p = m.prices.slice().sort((a, b) => (a.from || '').localeCompare(b.from || ''));
          if (new Set(p.map((x) => x.from || '')).size !== p.length) throw new Error('Două prețuri încep în aceeași lună');
          p[0] = { ...p[0], from: null };
          f.prices = p; f.price_import = p[p.length - 1].import; f.price_export = p[p.length - 1].export;
        }
        return { finance: (hass.fin = f) };
      }
      throw new Error(`comandă necunoscută: ${m.type}`);
    },
    // schimbă starea entității ca HA, apoi trimite cardului un `hass` nou
    callService: async (domain, service, data) => {
      hass.calls.push([domain, service, data]);
      await new Promise((r) => setTimeout(r, 300));
      const id = data.entity_id, set = (state) => { hass.states = { ...hass.states, [id]: { ...hass.states[id], state: String(state) } }; };
      if (service === 'turn_on' || service === 'turn_off') set(service === 'turn_on' ? 'on' : 'off');
      if (domain === 'select' && service === 'select_option') set(data.option);
      if (domain === 'number' && service === 'set_value') set(data.value);
      if (id === 'switch.evcs_demo_ev_charging') {
        const on = service === 'turn_on';
        Object.assign(hass.states, { 'sensor.evcs_demo_status': S(on ? 'charging' : 'connected'), 'sensor.evcs_demo_power': S(on ? 7180 : 0), 'sensor.ev_demo_charging_state': S(on ? 'charging' : 'not_charging') });
      }
      el.hass = { ...hass };
    },
  };
  const el = document.createElement('victron-vrm-card');
  el.setConfig({ view, automation: 'automation.energie_vrm', charger: 'evcs_demo', car: 'ev_demo', capacity: 20,
    battery: { power: 'sensor.demo_battery_power', voltage: 'sensor.demo_battery_voltage', current: 'sensor.demo_battery_current',
      temp: 'sensor.demo_battery_temperature', left: 'sensor.demo_time_left', full: 'sensor.demo_time_to_full' } });
  el.hass = hass;
  document.getElementById('c').appendChild(el);
  window.el = el; window.hassFake = hass;
})();
</script>
